name: 🚀 Deploy Monopoly Revolution to Oracle Free Tier

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute remote deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          script: |
            echo "🔄 Pulling latest code..."
            cd ~/Monopoly-Revolution
            git pull origin master || git pull origin main
            
            echo "📦 Installing production dependencies..."
            npm install --production
            
            echo "♻️ Restarting Monopoly Revolution process..."
            pm2 restart monopoly-revolution || pm2 start server/index.js --name "monopoly-revolution"
            
            echo "✅ Deployment successful!"
